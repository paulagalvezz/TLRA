<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY-CHATGPT</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="layout">
        <aside class="assistants-pane">
            <div class="assistants-header">
                <h2>Assistants</h2>
                <button id="new-assistant" type="button" title="New assistant" aria-label="New assistant">+</button>
            </div>
            <div id="assistants-list" class="assistants-list"></div>
        </aside>
        <main class="chat-pane">
            <header class="chat-header">
                <h1><span id="chat-title">EASY-CHATGPT</span> <span class="version">v4</span></h1>
                <button id="context-toggle" type="button">Context view</button>
            </header>
            <div id="messages" class="messages"></div>
            <div class="composer">
                <div id="preview-strip" class="preview-strip hidden"></div>
                <form id="chat-form" class="input-bar">
                    <button type="button" id="attach-button" title="Attach image" aria-label="Attach image">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <input type="file" id="image-input" accept="image/*" multiple hidden>
                    <textarea id="user-input" placeholder="Type a message... (or drop images)" rows="1"></textarea>
                    <button type="submit" id="send-button">Send</button>
                </form>
            </div>
        </main>
        <aside id="context-pane" class="context-pane hidden">
            <h2>Context view</h2>
            <div id="context-entries" class="context-entries"></div>
        </aside>
    </div>

    <div id="assistant-modal" class="modal-overlay hidden">
        <form id="assistant-form" class="modal">
            <h2 id="assistant-form-title">New assistant</h2>
            <label for="assistant-name">Name</label>
            <input id="assistant-name" type="text" maxlength="200" required>
            <label for="assistant-system">System prompt</label>
            <textarea id="assistant-system" rows="3" placeholder="You are a helpful assistant."></textarea>
            <label for="assistant-template">Prompt template</label>
            <textarea id="assistant-template" rows="8" required></textarea>
            <p class="hint">Must contain <code>{context}</code> and <code>{user_input}</code>. The full document is inserted into <code>{context}</code> on every single turn.</p>
            <label for="assistant-document">Document (.txt, UTF-8)</label>
            <input id="assistant-document" type="file" accept=".txt,text/plain">
            <p id="assistant-doc-info" class="hint hidden"></p>
            <p id="assistant-form-error" class="form-error hidden"></p>
            <div class="modal-actions">
                <button type="button" id="assistant-cancel">Cancel</button>
                <button type="submit" id="assistant-save">Save</button>
            </div>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
